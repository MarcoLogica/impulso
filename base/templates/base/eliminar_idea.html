{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Eliminar Idea</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #5dade2; margin: 0; padding: 40px; }
    .caja { max-width: 500px; margin: 0 auto; background: white; border-radius: 12px; padding: 30px; text-align: center; }
    button { background: #e74c3c; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    a { display: inline-block; margin-top: 15px; color: #2c3e50; }
  </style>
</head>
<body>
  <div class="caja">
    <h2>¿Eliminar esta idea?</h2>
    <p><strong>{{ idea.titulo }}</strong></p>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Sí, eliminar</button>
    </form>
    <a href="{% url 'lista_ideas' %}">Cancelar</a>
  </div>
</body>
</html>
