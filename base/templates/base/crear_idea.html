{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Capturar Idea – IMPULSO</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #5dade2; margin: 0; padding: 40px; }
    .caja { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; color: #2c3e50; }
    label { display: block; margin-top: 15px; font-weight: 600; color: #2c3e50; }
    input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 20px; background: #27ae60; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; }
    .volver { display: inline-block; margin-top: 15px; color: #2c3e50; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>💡 Capturar nueva idea</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar idea</button>
    </form>
    <a href="{% url 'lista_ideas' %}" class="volver">← Volver al buzón</a>
  </div>
</body>
</html>
