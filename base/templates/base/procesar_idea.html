{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Procesar Idea – IMPULSO</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #5dade2; margin: 0; padding: 40px; }
    .caja { max-width: 700px; margin: 0 auto; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; color: #2c3e50; }
    .idea-preview { background: #f8f9fa; border-left: 5px solid #3498db; padding: 15px; margin-bottom: 25px; border-radius: 6px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    select, input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .radio-group label { font-weight: normal; margin: 8px 0; }
    button { margin-top: 25px; background: #2980b9; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; }
    .volver { display: inline-block; margin-top: 15px; color: #2c3e50; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>⚡ Procesar idea</h1>

    <div class="idea-preview">
      <strong>{{ idea.titulo }}</strong>
      {% if idea.descripcion %}<p>{{ idea.descripcion }}</p>{% endif %}
    </div>

    <form method="post">
      {% csrf_token %}

      <p><strong>¿Qué quieres hacer con esta idea?</strong></p>
      {{ form.accion }}

      <div id="opciones-fase-tarea" style="margin-top: 20px;">
        <div>
          <label>Iniciativa:</label>
          {{ form.iniciativa }}
        </div>
        <div style="margin-top: 12px;">
          <label>Fase (solo si conviertes a Tarea):</label>
          {{ form.fase }}
        </div>
      </div>

      <button type="submit">Ejecutar acción</button>
    </form>

    <a href="{% url 'lista_ideas' %}" class="volver">← Volver al buzón</a>
  </div>
</body>
</html>
